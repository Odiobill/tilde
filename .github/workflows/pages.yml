{
  "name": "Manual Pages deployment",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "publication_manifest_sha256": {
          "description": "Reviewed exact public publication-manifest.json SHA256",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.x",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Verify the actual published release",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EXPECTED_MANIFEST_SHA256": "${{ inputs.publication_manifest_sha256 }}"
          },
          "run": "node scripts/verify-published-release.mjs --config docs/site/release.json --manifest-sha256 \"$EXPECTED_MANIFEST_SHA256\" --site-commit \"$GITHUB_SHA\" --output \"$RUNNER_TEMP/release-evidence.json\""
        },
        {
          "name": "Build offline production site",
          "env": {
            "PAGES_PROJECT": "${{ github.event.repository.name }}"
          },
          "run": "node scripts/build-docs.mjs --output \"$RUNNER_TEMP/site\" --base-path \"/${PAGES_PROJECT}/\" --mode production --release-evidence \"$RUNNER_TEMP/release-evidence.json\""
        },
        {
          "uses": "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9",
          "with": {
            "path": "${{ runner.temp }}/site",
            "retention-days": 1
          }
        }
      ],
      "permissions": {
        "contents": "read",
        "actions": "read"
      }
    },
    "deploy": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "needs": [
        "build"
      ],
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 10,
      "permissions": {
        "pages": "write",
        "id-token": "write"
      },
      "environment": {
        "name": "github-pages",
        "url": "${{ steps.deployment.outputs.page_url }}"
      },
      "steps": [
        {
          "id": "deployment",
          "uses": "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346"
        }
      ]
    }
  }
}
