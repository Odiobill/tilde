{
  "name": "Manual read-only release verification",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "publication_manifest_sha256": {
          "description": "Reviewed exact public publication-manifest.json SHA256",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "if": "${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}",
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 10,
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "ref": "${{ github.sha }}"
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.x",
            "package-manager-cache": false
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Verify exact private draft; never publish",
          "env": {
            "GH_TOKEN": "${{ github.token }}",
            "EXPECTED_MANIFEST_SHA256": "${{ inputs.publication_manifest_sha256 }}"
          },
          "run": "node scripts/verify-published-release.mjs --config docs/site/release.json --manifest-sha256 \"$EXPECTED_MANIFEST_SHA256\" --site-commit \"$GITHUB_SHA\" --output \"$RUNNER_TEMP/release-evidence.json\" --allow-draft"
        }
      ]
    }
  }
}
