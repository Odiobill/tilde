{
  "name": "Native synthetic CI",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {},
    "workflow_call": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "native": {
      "runs-on": "ubuntu-26.04",
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "node": [
            "22.19.0",
            "22.x",
            "24.x"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Ephemeral runner dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y cmake make g++ python3 libuv1-dev qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates bubblewrap desktop-file-utils dbus-user-session qt6ct fonts-dejavu-core\nci_uid=\"$(id -u)\"\nsudo systemctl start \"user@${ci_uid}.service\"\nprintf \"XDG_RUNTIME_DIR=/run/user/%s\\nDBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\\n\" \"$ci_uid\" \"$ci_uid\" >> \"$GITHUB_ENV\""
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "${{ matrix.node }}",
            "package-manager-cache": false
          }
        },
        {
          "name": "Synthetic build and native gates",
          "run": "npm ci --ignore-scripts\nnpm run build\nnpm run typecheck\nnpm test\nnpm run test:release\nctest --test-dir .build/cmake --output-on-failure\npython3 -m unittest discover -s tests/qualification/power -p \"*_test.py\"\nnode scripts/check-workflows.mjs\nnode scripts/build-docs.mjs --output \"$RUNNER_TEMP/docs\" --base-path /\nnode scripts/export-source.mjs --output \"$RUNNER_TEMP/source\" --version 0.1.0"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "source-${{ matrix.node }}",
            "path": "${{ runner.temp }}/source/tilde-0.1.0.tar.gz\n${{ runner.temp }}/source/source-manifest.json",
            "if-no-files-found": "error",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
